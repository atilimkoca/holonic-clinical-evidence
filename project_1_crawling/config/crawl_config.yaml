# =============================================================================
# Project 1 — Crawl & Data Generation Configuration
# BIL 930 Final Project · Student A · Holonic Data Modeling
#
# This file is the single source of truth for the data layer. It drives:
#   - crawler.py        (which clinical topics to crawl from PubMed)
#   - entity_extractor  (the curated medical knowledge used to normalise records)
#   - rdf_transformer   (drug/disease/source vocabularies)
#
# Data-source note (crawling ethics, assignment §1.1):
#   OpenEvidence.com is login-gated and its Terms of Service prohibit automated
#   scraping, so crawling it directly is neither legal nor reproducible. The
#   assignment explicitly permits PubMed Open Access / ClinicalTrials.gov as
#   alternative sources. We therefore crawl the NCBI PubMed E-utilities API,
#   which is a public, documented, rate-limited interface intended for
#   programmatic access. This is recorded as a *threat to construct validity*
#   in the report: our holons are reconstructed from primary-literature
#   abstracts rather than from OpenEvidence's synthesised answers.
# =============================================================================

crawl:
  source: pubmed
  base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/"
  # NCBI asks API clients to identify themselves; set your own e-mail before a
  # live crawl. The bundled cache is keyed with an empty e-mail, so offline
  # replay (--offline --refresh) works without changing this value.
  email: ""
  tool_name: "BIL930-HolonicKR-Project1"
  user_agent: "BIL930-HolonicKR/1.0 (academic project)"
  # NCBI allows 3 requests/sec without an API key. delay_seconds keeps us under it.
  delay_seconds: 0.4
  retmax_per_query: 12          # PMIDs fetched per clinical question
  max_articles_per_holon: 5     # citations kept per clinical-question holon
  max_retries: 3
  timeout_seconds: 20
  cache_dir: "data/raw/pubmed_cache"
  respect_robots: true
  seed: 42
  # If the network is unavailable, the crawler falls back to deterministic
  # synthetic citations so the pipeline is always reproducible offline.
  allow_synthetic_fallback: true

# Publication-type -> evidence level mapping (aligned with shared api_contracts.md).
# The numeric score becomes holon:confidence on the reified evidence assertion.
evidence_levels:
  "Meta-Analysis":               { level: "Level-1A", score: 0.95, source_class: "MetaAnalysis" }
  "Systematic Review":           { level: "Level-1A", score: 0.95, source_class: "SystematicReview" }
  "Randomized Controlled Trial": { level: "Level-1B", score: 0.90, source_class: "ClinicalTrial" }
  "Clinical Trial":              { level: "Level-2B", score: 0.70, source_class: "ClinicalTrial" }
  "Comparative Study":           { level: "Level-2A", score: 0.80, source_class: "ClinicalTrial" }
  "Observational Study":         { level: "Level-2B", score: 0.70, source_class: "EvidenceSource" }
  "Case Reports":                { level: "Level-4",  score: 0.40, source_class: "CaseReport" }
  "Review":                      { level: "Level-5",  score: 0.25, source_class: "EvidenceSource" }
  "_default":                    { level: "Level-3",  score: 0.55, source_class: "EvidenceSource" }

# Each disease is expanded into these clinical-question facets. With ~70
# diseases x 3 facets this yields >200 ClinicalQuestionHolons (assignment min).
question_templates:
  - id: "treatment"
    text: "What is the recommended first-line pharmacological treatment for {disease}?"
    pubmed_term: "{mesh}[mesh] AND (drug therapy[sh] OR therapy[sh]) AND (Randomized Controlled Trial[ptyp] OR Meta-Analysis[ptyp])"
    relation: "treats"
  - id: "efficacy"
    text: "How effective is {drug} compared with other agents for {disease}?"
    pubmed_term: "{mesh}[mesh] AND {drug}[tiab] AND (Randomized Controlled Trial[ptyp] OR Comparative Study[ptyp])"
    relation: "treats"
  - id: "safety"
    text: "What are the main adverse effects and contraindications of treating {disease} with {drug}?"
    pubmed_term: "{mesh}[mesh] AND {drug}[tiab] AND (adverse effects[sh] OR toxicity[sh])"
    relation: "causesSideEffect"

# Specialties used for the holon hierarchy (Difficulty A: Specialty -> Disease ->
# Evidence) and for community-detection ground truth in graph_analysis.py.
specialties:
  Cardiology:        "Heart and vascular disorders"
  Neurology:         "Disorders of the nervous system"
  Endocrinology:     "Hormonal and metabolic disorders"
  Psychiatry:        "Mental and behavioural disorders"
